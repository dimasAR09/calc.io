[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calc_io_backend"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "numpy",
    "scipy"
]

[tool.fastapi]
# Menentukan letak file utama agar sistem tidak mencarinya secara manual
main = "main:app"